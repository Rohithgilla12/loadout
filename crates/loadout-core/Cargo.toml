[package]
name = "loadout-core"
version = "0.2.0"
description = "Loadout engine — profiles, content-addressed skill store, symlink reconciliation"
authors = ["Rohith Gilla"]
license = "MIT"
repository = "https://github.com/Rohithgilla12/loadout"
edition = "2021"

[lib]
name = "loadout_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
dirs = "6"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli"], default-features = false }
tempfile = "3"
