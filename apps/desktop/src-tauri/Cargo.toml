[package]
name = "loadout"
version = "0.2.0"
description = "Loadout — switchable skill sets for AI coding agents"
authors = ["Rohith Gilla"]
license = "MIT"
repository = "https://github.com/Rohithgilla12/loadout"
edition = "2021"

[lib]
name = "loadout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
dirs = "6"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli"], default-features = false }
tokio = { version = "1", features = ["process", "fs", "macros"] }
tempfile = "3"
